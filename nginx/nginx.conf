# nginx/nginx.conf — Load balancer untuk demo performa (branch 01 & 02)
# Bahasa komentar: Indonesia
# Upstream 3 replica per service (untuk demo scale branch 03), tapi branch 01/02 tetap jalan 1 replica
# Proxy set header X-Request-Id (branch 01 tidak pakai — jebakan, branch 02 pakai)

worker_processes auto;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # GZIP — diaktifkan penuh di branch 03, di sini sudah on untuk demo
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 256;

  # ── Upstream: 3 replica per service (branch 03 scale, branch 01/02 fallback ke 1) ──
  upstream order_upstream {
    server order-service-1:3001 max_fails=3 fail_timeout=10s;
    server order-service-2:3001 max_fails=3 fail_timeout=10s;
    server order-service-3:3001 max_fails=3 fail_timeout=10s;
  }
  upstream payment_upstream {
    server payment-service-1:3002 max_fails=3 fail_timeout=10s;
    server payment-service-2:3002 max_fails=3 fail_timeout=10s;
    server payment-service-3:3002 max_fails=3 fail_timeout=10s;
  }
  upstream umkm_upstream {
    server umkm-service-1:3003 max_fails=3 fail_timeout=10s;
    server umkm-service-2:3003 max_fails=3 fail_timeout=10s;
    server umkm-service-3:3003 max_fails=3 fail_timeout=10s;
  }
  upstream kas_upstream {
    server kas-service-1:3004 max_fails=3 fail_timeout=10s;
    server kas-service-2:3004 max_fails=3 fail_timeout=10s;
    server kas-service-3:3004 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8080;
    server_name localhost;

    # ── Propagasi X-Request-Id: nginx set jika belum ada, service harus pakai ──
    # Branch 01 JEBAKAN: service tidak baca x-request-id -> trace putus
    # Branch 02 PROPER: service baca x-request-id -> trace utuh di Loki
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    # Health
    location /health {
      access_log off;
      return 200 '{"status":"ok","via":"nginx"}';
      add_header Content-Type application/json;
    }

    # Order service
    location /api/checkout {
      proxy_pass http://order_upstream;
    }
    location /api/order {
      proxy_pass http://order_upstream;
    }

    # Payment service
    location /api/payment {
      proxy_pass http://payment_upstream;
    }
    location /charge {
      proxy_pass http://payment_upstream;
    }

    # UMKM + pencarian
    location /api/cari {
      proxy_pass http://umkm_upstream;
    }
    location /api/umkm {
      proxy_pass http://umkm_upstream;
    }

    # Kas + ledger
    location /api/kas {
      proxy_pass http://kas_upstream;
    }
    location /api/ledger {
      proxy_pass http://kas_upstream;
    }
    location /api/donasi {
      proxy_pass http://kas_upstream;
    }

    # Komunitas (di-handle order-service di demo, atau umkm-service)
    location /api/komunitas {
      proxy_pass http://order_upstream;
    }

    # Fallback — coba order upstream
    location / {
      proxy_pass http://order_upstream;
    }
  }
}
