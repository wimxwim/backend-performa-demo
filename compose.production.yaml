# compose.production.yaml — REVERT KE PRODUCTION setelah bulk load 5M selesai
# Dipakai: docker compose -f compose.yaml -f compose.production.yaml up -d
# Atau manual: edit compose.yaml (wal_level minimal->replica, synchronous_commit off->on, max_wal_size 10GB->1GB) lalu docker compose up -d
# Setelah reload: psql -c "SELECT pg_reload_conf(); SHOW wal_level; SHOW synchronous_commit; SHOW max_wal_size;"
# Catatan: wal_level replica cukup untuk streaming replica; ganti ke logical jika butuh Debezium/CDC (butuh restart, bukan reload)
# Kenapa bukan compose.override.yaml? Karena compose.override.yaml auto-merge saat docker compose up -d (default jadi PROD).
# Untuk BULK sebagai default, file ini sengaja bernama compose.production.yaml agar tidak auto-merge.

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=on
      - -c
      - wal_level=replica
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=200
      - -c
      - random_page_cost=1.1
      - -c
      - seq_page_cost=1.0
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
