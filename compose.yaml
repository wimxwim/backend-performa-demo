name: gotongroyong-demo
# TUNED FOR 5M BULK - Ryzen 13GB NVMe 1.3GB/s - revert synchronous_commit on + wal_level replica/logical setelah load untuk production
# Infra inti — Rp0, tanpa observability. Jalankan: podman-compose up -d  /  docker compose up -d
# REVERT KE PRODUCTION (setelah bulk load selesai):
#   wal_level: minimal -> replica (atau logical jika butuh Debezium/CDC)
#   synchronous_commit: off -> on
#   max_wal_size: 10GB -> 1GB
#   Cara revert: edit compose.yaml (ganti 3 param di atas) lalu docker compose up -d
#   Alternatif: docker compose -f compose.yaml -f compose.production.yaml up -d  (lihat compose.production.yaml)
#   Setelah reload: psql -c "SELECT pg_reload_conf(); SHOW shared_buffers; SHOW wal_level; SHOW synchronous_commit;"
#   Catatan: compose.production.yaml adalah override production (wal_level replica, synchronous_commit on, max_wal_size 1GB).
#            Jika pakai compose.override.yaml (auto-merge), maka docker compose up -d default jadi PROD;
#            untuk BULK pakai docker compose -f compose.yaml up -d.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gotongroyong_demo
      POSTGRES_USER: ${POSTGRES_USER:-demo} # demo only - override via .env for production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123} # demo only - override via .env for production
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=10GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=off
      - -c
      - wal_level=minimal
      # ganti ke logical setelah load jika butuh replica/CDC Debezium, karena minimal hemat WAL 34GB
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=200
      - -c
      - random_page_cost=1.1
      - -c
      - seq_page_cost=1.0
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d gotongroyong_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo-net

  redis:
    image: redis:7-alpine
    container_name: gr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: gr-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: "postgres://demo:demo123@postgres:5432/gotongroyong_demo"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "25"
      LISTEN_PORT: "6432"
      ADMIN_USERS: demo
      AUTH_TYPE: md5
    networks:
      - demo-net

volumes:
  pgdata:
  redisdata:

networks:
  demo-net:
    driver: bridge
