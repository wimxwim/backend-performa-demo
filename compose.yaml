name: gotongroyong-demo
# Branch 03 Pasar 6.081 — scale: 3 container order-service + nginx LB + hostname
# Infra: postgres+redis+pgbouncer + 3x order-service + nginx LB
# Pino tetap (dari 02), tapi scale horizontal — log dari 3 container harus terpusat (next: 04 Alloy→Loki)
# Jalankan: podman-compose up -d  /  docker compose up -d  (scale 3 via replicas)

services:
  postgres:
    image: postgres:16-alpine
    container_name: gr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gotongroyong_demo
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=10GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=off
      - -c
      - wal_level=replica
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=200
      - -c
      - random_page_cost=1.1
      - -c
      - seq_page_cost=1.0
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d gotongroyong_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo-net

  redis:
    image: redis:7-alpine
    container_name: gr-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["full"]
    container_name: gr-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: "postgres://demo:demo123@postgres:5432/gotongroyong_demo"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "25"
      LISTEN_PORT: "6432"
      ADMIN_USERS: demo
      AUTH_TYPE: md5
    networks:
      - demo-net

  # ── 03 Pasar Scale: 3 container order-service + hostname ──
  order-service-1:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: gr-order-1
    hostname: order-1
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      PAYMENT_URL: http://payment-service-1:3002/charge
      LOG_LEVEL: info
      NODE_ENV: production
      HOSTNAME: order-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo-net

  order-service-2:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: gr-order-2
    hostname: order-2
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      PORT: 3001
      PAYMENT_URL: http://payment-service-1:3002/charge
      LOG_LEVEL: info
      NODE_ENV: production
      HOSTNAME: order-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo-net

  order-service-3:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: gr-order-3
    hostname: order-3
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      PORT: 3001
      PAYMENT_URL: http://payment-service-1:3002/charge
      LOG_LEVEL: info
      NODE_ENV: production
      HOSTNAME: order-3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo-net

  # ── Nginx LB — round-robin ke 3 container ──
  nginx:
    image: nginx:alpine
    container_name: gr-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service-1
      - order-service-2
      - order-service-3
    networks:
      - demo-net

volumes:
  pgdata:
  redisdata:

networks:
  demo-net:
    driver: bridge
