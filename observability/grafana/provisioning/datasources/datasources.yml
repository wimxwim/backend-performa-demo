# grafana provisioning — datasources: Prometheus + Loki + Jaeger (Tempo/Jaeger)
apiVersion: 1
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
