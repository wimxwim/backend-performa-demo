# observability/prometheus.yml — Prometheus scrape 10 jobs, interval 15s
# Bahasa komentar: Indonesia
# Sumber: Spec lock Bab 10.1 (3 pilar observability), Modul Performa Bab 8 (10 metrik)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: gotongroyong-demo
    env: demo

# Alertmanager (opsional — jika ada, uncomment)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ──────────────────────────────────────────────
  # 1. App services — 4 microservice (order, payment, umkm, kas)
  #    metrics_path /metrics (prom-client), port sesuai compose
  # ──────────────────────────────────────────────
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:3001']
        labels: { service: order-service }

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:3002']
        labels: { service: payment-service }

  - job_name: umkm-service
    metrics_path: /metrics
    static_configs:
      - targets: ['umkm-service:3003']
        labels: { service: umkm-service }

  - job_name: kas-service
    metrics_path: /metrics
    static_configs:
      - targets: ['kas-service:3004']
        labels: { service: kas-service }

  # ──────────────────────────────────────────────
  # 2. Infra — DB + cache + pool
  # ──────────────────────────────────────────────
  - job_name: pgbouncer
    metrics_path: /metrics
    static_configs:
      - targets: ['pgbouncer:9127']
        labels: { service: pgbouncer }

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ['redis:9121']
        labels: { service: redis }

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres:9187']
        labels: { service: postgres }

  # ──────────────────────────────────────────────
  # 3. Host & observability self
  # ──────────────────────────────────────────────
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ['node:9100']
        labels: { service: node }

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels: { service: prometheus }

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']
        labels: { service: loki }

  # ──────────────────────────────────────────────
  # 4. OTEL Collector — metrics 8889 (opsional)
  # ──────────────────────────────────────────────
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']
        labels: { service: otel-collector }
